		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

/* 두 손가락 조작(확대·회전)을 브라우저가 가로채지 않게 */
html, body, #canvas {
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

	<script>
// 손가락 두 개 이상이 닿으면 브라우저 기본 동작(확대, 밝기·볼륨 제스처 등)을 막고 게임에만 전달해요
(function () {
	var stop = function (e) { if (e.touches && e.touches.length > 1) { e.preventDefault(); } };
	document.addEventListener('touchstart', stop, { passive: false, capture: true });
	document.addEventListener('touchmove', stop, { passive: false, capture: true });
	['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
		document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
	});
	document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>

		<script>
// 큰 엔진 파일(index.wasm)을 깃허브 웹 업로드 제한(25MB)에 맞춰 3조각으로 나눴어요. 여기서 다시 이어 붙여요.
(function () {
	var parts = ['index.wasm.part1',  'index.wasm.part2'];
	var origFetch = window.fetch.bind(window);
	window.fetch = function (input, init) {
		var url = (typeof input === 'string') ? input : ((input && input.url) || '');
		if (url.split('?')[0].slice(-10) === 'index.wasm') {
			return Promise.all(parts.map(function (p) {
				return origFetch(p).then(function (r) {
					if (!r.ok) { throw new Error('missing ' + p); }
					return r.arrayBuffer();
				});
			})).then(function (bufs) {
				var blob = new Blob(bufs, { type: 'application/wasm' });
				return new Response(blob, { status: 200, headers: { 'Content-Type': 'application/wasm', 'Content-Length': String(blob.size) } });
			});
		}
		return origFetch(input, init);
	};
})();
</script>
<script>
// 소리 켜기: 아이폰은 무음(진동) 스위치가 켜져 있으면 웹 게임 소리를 막아요.
// 처음 화면을 누를 때 "재생" 모드로 바꾸고, 조용한 소리를 계속 틀어 두면 무음 모드에서도 소리가 나요.
(function () {
	var contexts = [];
	var AC = window.AudioContext || window.webkitAudioContext;
	if (AC) {
		var Wrapped = function (opts) {
			var ctx = new AC(opts);
			contexts.push(ctx);
			return ctx;
		};
		Wrapped.prototype = AC.prototype;
		window.AudioContext = Wrapped;
		if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
	}
	try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; } } catch (e) {}
	function silentWav() {
		var rate = 8000, n = 4000;
		var buf = new ArrayBuffer(44 + n);
		var v = new DataView(buf);
		function str(o, t) { for (var i = 0; i < t.length; i++) { v.setUint8(o + i, t.charCodeAt(i)); } }
		str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVE'); str(12, 'fmt ');
		v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
		v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
		str(36, 'data'); v.setUint32(40, n, true);
		for (var i = 0; i < n; i++) { v.setUint8(44 + i, 128); }
		return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
	}
	var tag = null;
	function unlock() {
		try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; } } catch (e) {}
		if (!tag) {
			tag = document.createElement('audio');
			tag.setAttribute('playsinline', '');
			tag.setAttribute('x-webkit-airplay', 'deny');
			tag.loop = true;
			tag.preload = 'auto';
			tag.src = silentWav();
		}
		var p = tag.play();
		if (p && p.catch) { p.catch(function () {}); }
		contexts.forEach(function (c) { if (c.state !== 'running' && c.resume) { c.resume(); } });
	}
	['touchstart', 'touchend', 'mousedown', 'keydown', 'click'].forEach(function (ev) {
		window.addEventListener(ev, unlock, { capture: true, passive: true });
	});
	if (location.search.indexOf('debug') >= 0) {
		var errs = [];
		window.addEventListener('error', function (e) { errs.push(String(e.message)); });
		window.addEventListener('unhandledrejection', function (e) { errs.push('promise: ' + String(e.reason)); });
		var oe = console.error;
		console.error = function () { errs.push([].slice.call(arguments).join(' ').slice(0, 160)); oe.apply(console, arguments); };
		var cnt = { src: 0, wk: 0, wkErr: 0 };
		var os = AudioBufferSourceNode.prototype.start;
		AudioBufferSourceNode.prototype.start = function () {
			cnt.src++;
			var bf = this.buffer;
			cnt.last = (bf ? bf.duration.toFixed(1) + 's/' + bf.sampleRate + '/' + bf.numberOfChannels + 'ch' : 'nobuf') + ' rate ' + this.playbackRate.value.toFixed(2);
			if (bf && bf.duration > 5) { cnt.longs = (cnt.longs || 0) + 1; }
			return os.apply(this, arguments);
		};
		var gains = [];
		var cg = BaseAudioContext.prototype.createGain;
		BaseAudioContext.prototype.createGain = function () { var g = cg.apply(this, arguments); gains.push(g); if (gains.length > 400) { gains.shift(); } return g; };
		var an = null, anBuf = null, peak = 0;
		var oc = AudioNode.prototype.connect;
		AudioNode.prototype.connect = function (dst) {
			if (dst instanceof AudioDestinationNode && !(this instanceof AnalyserNode)) {
				if (!an) { an = this.context.createAnalyser(); an.fftSize = 1024; anBuf = new Float32Array(1024); oc.call(an, this.context.destination); }
				oc.call(this, dst);
				return oc.call(this, an);
			}
			return oc.apply(this, arguments);
		};
		if (window.AudioWorkletNode) {
			var W0 = window.AudioWorkletNode;
			var W1 = function (c, n, o) { cnt.wk++; try { var x = new W0(c, n, o); x.onprocessorerror = function () { cnt.wkErr++; errs.push('worklet processor error'); }; return x; } catch (e) { cnt.wkErr++; errs.push('worklet: ' + e); throw e; } };
			W1.prototype = W0.prototype; window.AudioWorkletNode = W1;
		}
		var btn = document.createElement('button');
		btn.textContent = '삐';
		btn.style.cssText = 'position:fixed;right:8px;top:40%;z-index:100;font-size:20px;padding:14px 18px;border-radius:12px';
		btn.onclick = function () {
			contexts.forEach(function (c) {
				c.resume();
				var o = c.createOscillator(), g = c.createGain(); g.gain.value = 0.3;
				o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.4);
			});
		};
		var box = document.createElement('div');
		box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;background:rgba(0,0,0,.75);color:#fff;font:12px monospace;padding:6px;white-space:pre-wrap;pointer-events:none;max-height:40%;overflow:hidden';
		setInterval(function () {
			if (!box.parentNode && document.body) { document.body.appendChild(box); }
			if (!btn.parentNode && document.body) { document.body.appendChild(btn); }
			box.textContent = 'ctx ' + contexts.length + ': ' + contexts.map(function (c) { return c.state + '/' + c.sampleRate; }).join(', ') +
				' | tag ' + (tag ? (tag.paused ? 'paused' : 'play') : 'none') +
				' | src ' + cnt.src + ' wk ' + cnt.wk + '/' + cnt.wkErr +
				'\nlast ' + (cnt.last || '-') + ' long ' + (cnt.longs || 0) +
				' | peak ' + (function () { if (!an) { return 'none'; } an.getFloatTimeDomainData(anBuf); var m = 0; for (var i = 0; i < anBuf.length; i++) { m = Math.max(m, Math.abs(anBuf[i])); } peak = Math.max(peak * 0.9, m); return peak.toFixed(3); })() +
				' | gains ' + gains.length + ' zero ' + gains.filter(function (g) { return g.gain.value < 0.001; }).length +
				(contexts[0] ? ' | ch ' + contexts[0].destination.channelCount + '/' + contexts[0].destination.maxChannelCount + ' t ' + contexts[0].currentTime.toFixed(1) + ' lat ' + contexts[0].baseLatency : '') + '\n' + errs.slice(-8).join('\n');
		}, 500);
	}
	document.addEventListener('visibilitychange', function () {
		if (!document.hidden) { contexts.forEach(function (c) { if (c.resume) { c.resume(); } }); }
	});
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":29400112,"index.wasm":43699190},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
